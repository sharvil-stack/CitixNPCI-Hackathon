spring.application.name=demo
# Python ML service (FastAPI)
ml.service.url=${ML_SERVICE_URL:http://localhost:8003}
ml.service.connect-timeout-seconds=3
ml.service.read-timeout-seconds=60
#
## Uploads for /api/scams/analyze-image
#spring.servlet.multipart.max-file-size=10MB
#spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# Auth / users
# ---------------------------------------------------------------------------
# User store. Defaults to a local H2 file DB (./data/finora). For Postgres/MySQL set the three
# SPRING_DATASOURCE_* env vars and add the matching JDBC driver to the pom.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/finora;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# JWT signing key (HS256, must be >= 32 bytes). ALWAYS override FINORA_JWT_SECRET outside local dev.
finora.jwt.secret=${FINORA_JWT_SECRET:dev-only-change-me-dev-only-change-me-0123456789}
finora.jwt.issuer=finora
finora.jwt.access-token-minutes=15
finora.jwt.refresh-token-days=14


# Paths reachable without a token
finora.security.public-paths=/api/scams/**

# Allowed frontend origins for local development
finora.security.allowed-origins[0]=http://localhost:5173
finora.security.allowed-origins[1]=http://localhost:5174
finora.security.allowed-origins[2]=http://localhost:5175
finora.security.allowed-origins[3]=http://127.0.0.1:5173
finora.security.allowed-origins[4]=http://127.0.0.1:5174
finora.security.allowed-origins[5]=http://127.0.0.1:5175

finora.security.max-failed-attempts=5
finora.security.lock-minutes=15

